    <h2> We are learning forms today</h2>

        <label for="Number">Apna number dedo jii</label>

        <input type="number" placeholder="Number daal idhar" id="Number" name="Number" value="9563214XXX"/>

        <br>
        <label for="DOB">Apna janamdin ki tarik</label>

        <input type="datetime-local" placeholder="Enter  your DOB" id="DOB" name="DOB" value="DOB"/>

        
    </form>

</body>
